<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>智护星 · 用户管理</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0d1219; --surface:#131a23; --surface-2:#18212c; --line:#283442;
  --text:#f2f6fb; --muted:#8f9baa; --blue:#1677ff; --blue-2:#4096ff;
  --green:#2dd4a3; --amber:#f4a83a; --red:#ff5d64;
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.header { height:60px; padding:0 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#101720; }
.brand { display:flex; align-items:baseline; gap:16px; }
.brand h1 { margin:0; font-size:19px; letter-spacing:.2px; }
.muted { color:var(--muted); }
.logout { color:#ff7b80; text-decoration:none; margin-left:18px; }
.main { padding:22px 24px 40px; max-width:1480px; margin:0 auto; }
.toolbar { display:flex; gap:12px; margin-bottom:16px; }
.search { flex:1; max-width:720px; height:42px; padding:0 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); outline:none; }
.search:focus,input:focus,textarea:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(22,119,255,.16); }
.select,.btn { min-height:40px; padding:0 15px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--text); }
.btn:hover { border-color:#456079; }
.btn-primary { background:var(--blue); border-color:var(--blue); color:white; }
.btn-primary:hover { background:var(--blue-2); }
.btn-danger { color:#ff8d92; border-color:rgba(255,93,100,.42); background:rgba(255,93,100,.08); }
.btn-warning { color:#ffc36c; border-color:rgba(244,168,58,.42); background:rgba(244,168,58,.08); }
.summary { display:grid; grid-template-columns:repeat(7,minmax(90px,1fr)); margin-bottom:16px; border:1px solid var(--line); border-radius:9px; background:var(--surface); overflow:hidden; }
.metric { padding:14px 16px; border-right:1px solid var(--line); }
.metric:last-child { border-right:0; }
.metric span { display:block; color:var(--muted); font-size:12px; }
.metric strong { display:block; margin-top:6px; font-size:19px; }
.table-shell { border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface); }
table { width:100%; border-collapse:collapse; }
th { padding:12px 16px; text-align:left; color:#aab5c3; font-size:12px; font-weight:600; background:#111821; border-bottom:1px solid var(--line); }
td { padding:12px 16px; border-bottom:1px solid rgba(40,52,66,.72); }
tbody tr { transition:background .15s; }
tbody tr:hover,tbody tr.selected { background:#182535; }
tbody tr { cursor:pointer; }
tbody tr:last-child td { border-bottom:0; }
.identity { display:flex; align-items:center; gap:11px; min-width:180px; }
.avatar { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:50%; color:white; font-weight:650; background:#1765c7; border:1px solid rgba(255,255,255,.16); }
.identity strong,.identity small { display:block; }
.identity small { color:var(--muted); margin-top:2px; }
.status { display:inline-flex; align-items:center; gap:6px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
.dot.frozen { background:var(--amber); }
.empty { padding:64px 20px; text-align:center; color:var(--muted); }
.footer { display:flex; justify-content:space-between; padding-top:14px; color:var(--muted); font-size:12px; }
.drawer-backdrop { position:fixed; inset:60px 0 0; z-index:40; background:rgba(4,8,13,.38); opacity:0; pointer-events:none; transition:opacity .2s; }
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer { position:fixed; z-index:50; top:0; right:0; width:min(440px,100vw); height:100vh; padding:28px; overflow:auto; background:#121a24; border-left:1px solid var(--line); box-shadow:-18px 0 48px rgba(0,0,0,.34); transform:translateX(100%); transition:transform .24s ease; }
.drawer.open { transform:translateX(0); }
.drawer-close { position:absolute; top:18px; right:20px; width:36px; height:36px; border:0; background:transparent; color:#b4bfcb; font-size:26px; }
.profile { display:flex; gap:16px; align-items:center; padding:36px 0 20px; }
.profile .avatar { width:64px; height:64px; font-size:22px; }
.profile h2 { margin:0 0 5px; font-size:21px; }
.drawer-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
.section { padding:20px 0; border-top:1px solid var(--line); }
.section h3 { margin:0 0 15px; font-size:15px; }
.detail-row { display:grid; grid-template-columns:88px 1fr; gap:12px; margin:10px 0; }
.detail-row dt { color:var(--muted); }
.detail-row dd { margin:0; overflow-wrap:anywhere; }
.pill { display:inline-block; padding:2px 8px; border-radius:999px; background:rgba(244,168,58,.13); color:#ffc36c; font-size:12px; }
.danger-zone { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modal-overlay { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(3,7,12,.72); }
.modal-overlay.open { display:flex; }
.modal { width:min(520px,100%); max-height:90vh; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#151e29; box-shadow:0 24px 70px rgba(0,0,0,.46); }
.modal-head,.modal-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.modal-foot { justify-content:flex-end; border-top:1px solid var(--line); border-bottom:0; }
.modal-head h3 { margin:0; font-size:16px; }
.modal-body { padding:20px; }
.close { border:0; background:transparent; color:var(--muted); font-size:22px; }
.field { margin-bottom:14px; }
.field label { display:block; margin-bottom:6px; color:#c7d0db; }
.field input,.field textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:7px; background:#0f161f; color:var(--text); outline:none; }
.field textarea { min-height:72px; resize:vertical; }
.hint { color:var(--muted); font-size:12px; margin-top:6px; }
.toast { position:fixed; z-index:100; top:18px; left:50%; transform:translateX(-50%); padding:10px 18px; border:1px solid var(--line); border-radius:8px; background:#182230; box-shadow:0 10px 30px rgba(0,0,0,.35); }
.toast.success { border-color:rgba(45,212,163,.45); color:#8de7ca; }
.toast.error { border-color:rgba(255,93,100,.5); color:#ff9ba0; }
@media (max-width:900px) { .summary { grid-template-columns:repeat(3,1fr); } .metric:nth-child(3n) { border-right:0; } th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5) { display:none; } }
@media (max-width:600px) { .main,.header { padding-left:14px; padding-right:14px; } .toolbar { flex-wrap:wrap; } .search { max-width:none; width:100%; flex-basis:100%; } .summary { grid-template-columns:repeat(2,1fr); } .drawer { padding:20px; } th:nth-child(2),td:nth-child(2) { display:none; } }
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>智护星 · 用户管理</h1><span class="muted" id="accountCount">0 个账号</span></div>
  <div><span class="muted">安全管理后台</span><a class="logout" href="/admin/logout">退出登录</a></div>
</header>

<main class="main">
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="搜索用户名 / 昵称 / 手机号 / 邮箱" autocomplete="off">
    <select class="select" id="statusFilter" aria-label="筛选账号状态">
      <option value="all">全部状态</option><option value="active">正常</option><option value="frozen">已冻结</option><option value="legacy">待升级密码</option>
    </select>
    <button class="btn btn-primary" type="button" onclick="openAdd()">添加用户</button>
  </div>

  <section class="summary" aria-label="账号概览">
    <div class="metric"><span>总数</span><strong id="mTotal">0</strong></div>
    <div class="metric"><span>有手机号</span><strong id="mPhone">0</strong></div>
    <div class="metric"><span>有邮箱</span><strong id="mEmail">0</strong></div>
    <div class="metric"><span>有地址</span><strong id="mAddress">0</strong></div>
    <div class="metric"><span>云端头像</span><strong id="mAvatar">0</strong></div>
    <div class="metric"><span>加密（scrypt）</span><strong id="mScrypt">0</strong></div>
    <div class="metric"><span>待升级</span><strong id="mLegacy">0</strong></div>
  </section>

  <section class="table-shell">
    <table>
      <thead><tr><th>用户</th><th>手机号</th><th>邮箱</th><th>注册时间</th><th>最后登录</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
  <div class="footer"><span id="resultCount">共 0 条记录</span><span>点击用户查看详情</span></div>
</main>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDetails()"></div>
<aside class="drawer" id="detailDrawer" aria-hidden="true" aria-label="用户详情">
  <button class="drawer-close" type="button" onclick="closeDetails()" aria-label="关闭">×</button>
  <div id="drawerContent"></div>
</aside>

<div class="modal-overlay" id="editModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-head"><h3 id="editTitle">编辑资料</h3><button class="close" onclick="closeModal('editModal')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="editOriginalUsername">
      <div class="field"><label>用户名</label><input id="editUsername" maxlength="80"></div>
      <div class="field"><label>昵称</label><input id="editNickname" maxlength="80"></div>
      <div class="field"><label>手机号</label><input id="editPhone" maxlength="30"></div>
      <div class="field"><label>邮箱</label><input id="editEmail" maxlength="254"></div>
      <div class="field"><label>地址</label><textarea id="editAddress" maxlength="500"></textarea></div>
      <div class="field" id="initialPasswordField"><label>初始密码</label><input type="password" id="editPassword" autocomplete="new-password" maxlength="128"><div class="hint">仅创建账号时使用；服务端只保存加密结果。</div></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('editModal')">取消</button><button class="btn btn-primary" onclick="saveUser()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="resetModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="modal-head"><h3 id="resetTitle">重置密码</h3><button class="close" onclick="closeModal('resetModal')">×</button></div>
    <div class="modal-body">
      <p class="muted">无法查看原密码。重置后，该账号全部设备立即退出。</p>
      <div class="field"><label>新密码</label><input type="password" id="newPassword" autocomplete="new-password" maxlength="128"></div>
      <div class="field"><label>确认新密码</label><input type="password" id="confirmPassword" autocomplete="new-password" maxlength="128"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('resetModal')">取消</button><button class="btn btn-primary" onclick="confirmResetPassword()">确认重置</button></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-head"><h3 id="confirmTitle">确认操作</h3><button class="close" onclick="closeModal('confirmModal')">×</button></div>
    <div class="modal-body" id="confirmText"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('confirmModal')">取消</button><button class="btn btn-danger" id="confirmAction">确认</button></div>
  </div>
</div>

<script>
let allUsers = [];
let selectedUsername = null;
let editMode = 'add';

const $ = id => document.getElementById(id);
const escapeHtml = value => {
  const node = document.createElement('div');
  node.textContent = value == null ? '' : String(value);
  return node.innerHTML;
};
const formatTime = value => value ? new Date(value < 100000000000 ? value * 1000 : value).toLocaleString('zh-CN', {hour12:false}) : '-';
const initials = user => (user.nickname || user.username || '?').trim().slice(0, 2).toUpperCase();
const maskPhone = value => value && value.length >= 7 ? value.slice(0,3) + '****' + value.slice(-4) : (value || '-');
const maskEmail = value => {
  if (!value || !value.includes('@')) return value || '-';
  const [name, domain] = value.split('@');
  return name.slice(0, Math.min(3, name.length)) + '****@' + domain;
};

async function requestJson(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok || !data.success) throw new Error(data.message || '请求失败');
  return data;
}

async function loadUsers() {
  try {
    const data = await requestJson('/admin/api/users');
    allUsers = data.data;
    if (selectedUsername && !findUser(selectedUsername)) closeDetails();
    renderSummary();
    renderTable();
    if (selectedUsername) renderDrawer(findUser(selectedUsername));
  } catch (error) { showToast(error.message, 'error'); }
}

function renderSummary() {
  const count = predicate => allUsers.filter(predicate).length;
  $('accountCount').textContent = allUsers.length + ' 个账号';
  $('mTotal').textContent = allUsers.length;
  $('mPhone').textContent = count(u => u.phone);
  $('mEmail').textContent = count(u => u.email);
  $('mAddress').textContent = count(u => u.address);
  $('mAvatar').textContent = count(u => u.avatar_synced);
  $('mScrypt').textContent = count(u => u.password_scheme === 'scrypt');
  $('mLegacy').textContent = count(u => u.password_scheme !== 'scrypt');
}

function filteredUsers() {
  const q = $('search').value.trim().toLowerCase();
  const status = $('statusFilter').value;
  return allUsers.filter(user => {
    const matchesText = !q || ['username','nickname','phone','email'].some(key => String(user[key] || '').toLowerCase().includes(q));
    const matchesStatus = status === 'all' || (status === 'active' && !user.is_frozen) || (status === 'frozen' && user.is_frozen) || (status === 'legacy' && user.password_scheme !== 'scrypt');
    return matchesText && matchesStatus;
  });
}

function renderTable() {
  const users = filteredUsers();
  $('resultCount').textContent = '共 ' + users.length + ' 条记录';
  if (!users.length) { $('tbody').innerHTML = '<tr><td class="empty" colspan="5">没有匹配的用户</td></tr>'; return; }
  $('tbody').innerHTML = users.map(user => `<tr class="${selectedUsername === user.username ? 'selected' : ''}" onclick="openDetails('${encodeURIComponent(user.username)}')">
    <td><div class="identity"><div class="avatar">${escapeHtml(initials(user))}</div><div><strong>${escapeHtml(user.nickname || user.username)}</strong><small>${escapeHtml(user.username)} · ${user.is_frozen ? '已冻结' : '正常'}</small></div></div></td>
    <td>${escapeHtml(maskPhone(user.phone))}</td><td>${escapeHtml(maskEmail(user.email))}</td><td>${escapeHtml(formatTime(user.create_time))}</td>
    <td>${escapeHtml(formatTime(user.last_login))}</td></tr>`).join('');
}

function findUser(username) { return allUsers.find(user => user.username === username); }

function openDetails(encodedUsername) {
  selectedUsername = decodeURIComponent(encodedUsername);
  renderTable();
  renderDrawer(findUser(selectedUsername));
  $('detailDrawer').classList.add('open');
  $('drawerBackdrop').classList.add('open');
  $('detailDrawer').setAttribute('aria-hidden', 'false');
}

function closeDetails() {
  selectedUsername = null;
  $('detailDrawer').classList.remove('open');
  $('drawerBackdrop').classList.remove('open');
  $('detailDrawer').setAttribute('aria-hidden', 'true');
  renderTable();
}

function renderDrawer(user) {
  if (!user) return;
  const passwordState = user.password_scheme === 'scrypt' ? '已加密' : '待升级';
  $('drawerContent').innerHTML = `<div class="profile"><div class="avatar">${escapeHtml(initials(user))}</div><div><h2>${escapeHtml(user.nickname || user.username)}</h2><div class="muted">${escapeHtml(user.username)} · ${user.is_frozen ? '已冻结' : '正常'}</div></div></div>
    <div class="drawer-actions"><button class="btn btn-primary" onclick="openEdit()">编辑资料</button><button class="btn" onclick="openResetPassword()">重置密码</button></div>
    <section class="section"><h3>基本信息</h3><dl><div class="detail-row"><dt>手机号</dt><dd>${escapeHtml(user.phone || '未设置')}</dd></div><div class="detail-row"><dt>邮箱</dt><dd>${escapeHtml(user.email || '未设置')}</dd></div><div class="detail-row"><dt>地址</dt><dd>${escapeHtml(user.address || '未设置')}</dd></div><div class="detail-row"><dt>注册时间</dt><dd>${escapeHtml(formatTime(user.create_time))}</dd></div></dl></section>
    <section class="section"><h3>头像同步</h3><div class="detail-row"><dt>云端头像</dt><dd>${user.avatar_synced ? '已同步' : '未设置'}</dd></div><div class="detail-row"><dt>更新时间</dt><dd>${escapeHtml(formatTime(user.avatar_updated_at))}</dd></div><p class="muted">设备路径只保存在本机，后台不再显示。</p></section>
    <section class="section"><h3>账号安全</h3><div class="detail-row"><dt>密码状态</dt><dd><span class="pill">${passwordState}</span></dd></div><div class="detail-row"><dt>加密方式</dt><dd>${user.password_scheme === 'scrypt' ? 'scrypt' : '旧格式'}</dd></div><div class="detail-row"><dt>密码内容</dt><dd>不可查看</dd></div><div class="detail-row"><dt>活跃会话</dt><dd>${user.session_count || 0} 个</dd></div><div class="detail-row"><dt>最近登录</dt><dd>${escapeHtml(formatTime(user.last_login))}</dd></div></section>
    <section class="section"><div class="danger-zone"><button class="btn btn-warning" onclick="confirmFreeze()">${user.is_frozen ? '解冻账号' : '冻结账号'}</button><button class="btn btn-danger" onclick="confirmDelete()">删除账号</button></div></section>`;
}

function openAdd() {
  editMode = 'add';
  $('editTitle').textContent = '添加用户';
  $('editOriginalUsername').value = '';
  ['editUsername','editNickname','editPhone','editEmail','editAddress','editPassword'].forEach(id => $(id).value = '');
  $('editUsername').readOnly = false;
  $('initialPasswordField').style.display = '';
  openModal('editModal');
}

function openEdit() {
  const user = findUser(selectedUsername);
  if (!user) return;
  editMode = 'edit';
  $('editTitle').textContent = '编辑资料';
  $('editOriginalUsername').value = user.username;
  $('editUsername').value = user.username;
  $('editUsername').readOnly = true;
  $('editNickname').value = user.nickname || '';
  $('editPhone').value = user.phone || '';
  $('editEmail').value = user.email || '';
  $('editAddress').value = user.address || '';
  $('initialPasswordField').style.display = 'none';
  openModal('editModal');
}

async function saveUser() {
  const body = { nickname:$('editNickname').value.trim(), phone:$('editPhone').value.trim(), email:$('editEmail').value.trim(), address:$('editAddress').value.trim() };
  try {
    if (editMode === 'add') {
      body.username = $('editUsername').value.trim();
      body.password = $('editPassword').value;
      if (!body.username || body.password.length < 4) throw new Error('用户名不能为空，密码至少 4 位');
      await requestJson('/admin/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    } else {
      await requestJson('/admin/api/users/' + encodeURIComponent($('editOriginalUsername').value), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    }
    closeModal('editModal');
    showToast(editMode === 'add' ? '用户已创建' : '资料已保存', 'success');
    await loadUsers();
  } catch (error) { showToast(error.message, 'error'); }
}

function openResetPassword() {
  $('newPassword').value = '';
  $('confirmPassword').value = '';
  openModal('resetModal');
}

async function confirmResetPassword() {
  const password = $('newPassword').value;
  if (password.length < 4 || password.length > 128) return showToast('新密码长度须为 4 至 128 位', 'error');
  if (password !== $('confirmPassword').value) return showToast('两次输入的密码不一致', 'error');
  try {
    await requestJson('/admin/api/users/' + encodeURIComponent(selectedUsername) + '/reset-password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({newPassword:password})});
    closeModal('resetModal');
    showToast('密码已重置，全部设备已退出', 'success');
    await loadUsers();
  } catch (error) { showToast(error.message, 'error'); }
}

function confirmFreeze() {
  const user = findUser(selectedUsername); if (!user) return;
  const action = user.is_frozen ? '解冻' : '冻结';
  openConfirm(action + '账号', `确认${action}“${escapeHtml(user.nickname || user.username)}”吗？${user.is_frozen ? '' : '冻结后全部设备立即退出。'}`, async () => {
    await requestJson('/admin/api/users/' + encodeURIComponent(user.username) + '/freeze', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({frozen:!Boolean(user.is_frozen)})});
    showToast('账号已' + action, 'success'); await loadUsers();
  });
}

function confirmDelete() {
  const user = findUser(selectedUsername); if (!user) return;
  openConfirm('删除账号', `确认永久删除“${escapeHtml(user.nickname || user.username)}”吗？此操作不可撤销。`, async () => {
    await requestJson('/admin/api/users/' + encodeURIComponent(user.username), {method:'DELETE'});
    closeDetails(); showToast('账号已删除', 'success'); await loadUsers();
  });
}

function openConfirm(title, html, action) {
  $('confirmTitle').textContent = title;
  $('confirmText').innerHTML = html;
  $('confirmAction').onclick = async () => { try { await action(); closeModal('confirmModal'); } catch (error) { showToast(error.message, 'error'); } };
  openModal('confirmModal');
}

function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
function showToast(message, type) { const toast=document.createElement('div'); toast.className='toast '+type; toast.textContent=message; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2600); }

$('search').addEventListener('input', renderTable);
$('statusFilter').addEventListener('change', renderTable);
