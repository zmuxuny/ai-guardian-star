limit_req_zone $binary_remote_addr zone=wenxin_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wenxin_otp:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=wenxin_ai:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=wenxin_admin:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=wenxin_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream wenxin_backend {
    server 127.0.0.1:8899;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aistar.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aistar.asia;

    ssl_certificate /etc/letsencrypt/live/api.aistar.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aistar.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /admin/login {
        limit_req zone=wenxin_admin burst=5 nodelay;
        limit_conn wenxin_conn 4;
        client_max_body_size 8k;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://wenxin_backend;
    }

    location ^~ /admin {
        limit_conn wenxin_conn 4;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://wenxin_backend;
    }

    location = /api/login {
        limit_req zone=wenxin_auth burst=10 nodelay;
        limit_conn wenxin_conn 10;
        client_max_body_size 32k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/register {
        limit_req zone=wenxin_auth burst=10 nodelay;
        limit_conn wenxin_conn 10;
        client_max_body_size 32k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/refresh {
        limit_req zone=wenxin_auth burst=10 nodelay;
        limit_conn wenxin_conn 10;
        client_max_body_size 32k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/otp/send {
        limit_req zone=wenxin_otp burst=2 nodelay;
        limit_conn wenxin_conn 4;
        client_max_body_size 16k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/contact/otp/send {
        limit_req zone=wenxin_otp burst=2 nodelay;
        limit_conn wenxin_conn 4;
        client_max_body_size 16k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/contact/update {
        limit_req zone=wenxin_auth burst=10 nodelay;
        limit_conn wenxin_conn 10;
        client_max_body_size 32k;
        proxy_pass http://wenxin_backend;
    }

    location = /api/avatar {
        limit_req zone=wenxin_auth burst=10 nodelay;
        limit_conn wenxin_conn 4;
        client_max_body_size 1m;
        proxy_pass http://wenxin_backend;
    }

    location = /ai/chat {
        limit_req zone=wenxin_ai burst=15 nodelay;
        limit_conn wenxin_conn 4;
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://wenxin_backend;
    }

    location / {
        limit_conn wenxin_conn 20;
        proxy_pass http://wenxin_backend;
    }
}
